spring:
  application:
    name: discodeit
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: never

  datasource:
    url: jdbc:h2:mem:discodeit_db;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    org.springframework.jdbc.datasource.init: debug
    org.springframework.security: trace
    com.example.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: debug