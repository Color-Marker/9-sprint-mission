name: discodeit-deploy

on:
  push:
    branches: [ "release" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1) 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # 2) AWS 자격 증명 설정 - public ecr인데.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3) ECR 로그인 이긴 한데 public이라 단순화해도 될 듯
      - name: ECR Login
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # 4) Docker 빌드
      - name: Docker build
        env:
          REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
          REGISTRY_ALIAS: ${{ secrets.ECR_PUBLIC_ALIAS }}
          REPOSITORY: discodeit
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$REGISTRY/$REGISTRY_ALIAS/$REPOSITORY
          SHORT_SHA=$(echo $IMAGE_TAG | cut -c1-7)
          docker build -t $IMAGE_URI:latest -t $IMAGE_URI:$SHORT_SHA .
          docker push $IMAGE_URI:latest
          docker push $IMAGE_URI:$SHORT_SHA